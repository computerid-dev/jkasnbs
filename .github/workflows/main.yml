name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Cek file proyek
        run: |
          missing=0
          for f in package.json capacitor.config.json www/index.html www/app.js www/style.css www/logo.png icon/mipmap-xxxhdpi/ic_launcher.png; do
            if [ -f "$f" ]; then echo "OK      $f"; else echo "HILANG  $f"; missing=1; fi
          done
          for ref in app.js style.css; do
            grep -q "$ref" www/index.html || { echo "index.html tidak memanggil $ref"; missing=1; }
          done
          if [ "$missing" -ne 0 ]; then
            echo "Ada file yang hilang. Pastikan isi zip ada di root repo, bukan di dalam folder lagi."
            ls -la
            exit 1
          fi

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan Android SDK bawaan runner
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKM" || { echo "sdkmanager tidak ditemukan di $ANDROID_HOME"; exit 1; }
          echo "Memakai $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Pasang dependensi
        run: npm install --no-audit --no-fund

      - name: Buat proyek Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Pasang ikon aplikasi
        run: |
          res=android/app/src/main/res
          test -d "$res" || { echo "Folder $res tidak ada"; exit 1; }
          rm -f "$res"/mipmap-anydpi-v26/ic_launcher.xml "$res"/mipmap-anydpi-v26/ic_launcher_round.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$res/mipmap-$d"
            cp icon/mipmap-$d/*.png "$res/mipmap-$d/"
          done
          ls "$res"/mipmap-xxxhdpi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Cek hasil APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk" || { echo "APK tidak ditemukan di $apk"; find android -name "*.apk"; exit 1; }
          ls -lh "$apk"

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: poskesdes-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
